<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pikGPS</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="sidebar">
      <!-- API Key 設定 -->
      <section id="apikey-section">
        <label>Google Maps API Key（留空使用 OpenStreetMap）</label>
        <input type="password" id="input-apikey" placeholder="AIza...（留空使用免費地圖）" autocomplete="off" />
        <div style="display:flex; gap:6px;">
          <button id="btn-apikey-apply" style="flex:1;">套用並重新載入</button>
          <button id="btn-apikey-clear" style="flex:1; background:#f38ba8;">清除（用免費地圖）</button>
        </div>
        <div id="apikey-status"></div>
      </section>

      <h2>pikGPS 控制台</h2>

      <!-- 裝置狀態 -->
      <section>
        <label>裝置選擇</label>
        <select id="device-select">
          <option value="">-- 偵測中… --</option>
        </select>
        <div id="device-connection-info"></div>
        <button id="btn-refresh-device">重新整理</button>
        <div id="keepalive-row">
          <span id="keepalive-indicator"></span>
          <button id="btn-keepalive-toggle" disabled>暫停鎖定</button>
        </div>
      </section>

      <!-- 位置設定 -->
      <section id="location-section">
        <label>地點搜尋</label>
        <input type="text" id="input-search" placeholder="搜尋地點（Enter 確認）..." />
        <label>座標（緯度, 經度）</label>
        <input
          type="text"
          id="input-coord"
          placeholder="25.047800, 121.531900"
          autocomplete="off"
        />
        <div id="location-action-row">
          <button id="btn-confirm-location">✓ 改變定位</button>
          <button id="btn-back-location" disabled title="回到目前定位（置中地圖）">↩</button>
        </div>
        <button id="btn-fav-add-location">★ 加入最愛地點</button>
        <ul id="fav-location-list"></ul>
        <details id="history-details">
          <summary id="history-summary">歷史記錄（0）</summary>
          <ul id="history-list"></ul>
        </details>
      </section>


      <!-- 路徑規劃 -->
      <section>
        <label>路徑規劃</label>
        <div id="waypoint-mode-hint">在地圖上點擊新增航點（先開啟模式）</div>
        <button id="btn-toggle-waypoint-mode">開啟航點模式</button>
        <ul id="waypoint-list"></ul>
        <label>速度（km/h）</label>
        <input type="range" id="speed-slider" min="1" max="50" value="10" />
        <span id="speed-display">10 km/h</span>
        <div>
          <button id="btn-route-start" disabled>▶ 開始播放</button>
          <button id="btn-route-stop" disabled>■ 停止</button>
          <button id="btn-route-clear">清除航點</button>
        </div>
        <button id="btn-fav-save-route">★ 儲存路徑</button>
        <ul id="fav-route-list"></ul>
      </section>

    </div>

    <div id="map-wrapper">
      <div id="map"></div>
      <div id="status-msg"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <!-- Google Maps 由 app.js 動態注入（當 API Key 存在時） -->
  </body>
</html>
